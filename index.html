<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline · Videojocs</title>
  <meta name="description" content="Col·loca cada videojoc al seu lloc de la línia temporal.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style3d.css">
  <script>
    // Sense WebGL, anem a la versió 2D.
    (function () {
      try {
        var c = document.createElement("canvas");
        if (!(c.getContext("webgl2") || c.getContext("webgl"))) throw 0;
      } catch (e) { location.replace("2d.html"); }
    })();
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body class="three">
  <div id="stage" class="stage"></div>

  <header class="top">
    <h1>Timeline <span>· Videojocs</span></h1>
    <div class="stats">
      <div class="stat score"><b id="score">0</b><small>punts</small></div>
      <div class="stat"><b id="hits">0</b><small>encerts</small></div>
      <div class="stat"><b id="misses">0</b><small>errors</small></div>
      <div class="stat"><b id="left">0</b><small>queden</small></div>
    </div>
    <div class="controls">
      <label>Cartes
        <select id="length">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="40">40</option>
          <option value="0">Totes</option>
        </select>
      </label>
      <button id="restart" class="btn">Nova partida</button>
      <a class="btn" href="2d.html">2D</a>
    </div>
  </header>

  <div id="legend" class="legend" aria-label="Plataformes"></div>

  <p id="hint" class="hint3d">Arrossega la carta fins a un forat de la línia temporal, o toca un <b>+</b>. Arrossega la taula o fes servir la roda per moure't.</p>

  <div id="loading" class="loading">Barrejant la baralla…</div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="zoom" class="zoom" hidden>
    <figure>
      <div class="zoom-card"><img id="zoom-img" alt=""><div class="zoom-foil"></div></div>
      <figcaption id="zoom-cap"></figcaption>
    </figure>
  </div>

  <div id="end" class="end" hidden>
    <div class="end-box">
      <h2>Fi de la partida</h2>
      <p class="end-score"><b id="end-score">0</b> punts</p>
      <p id="end-detail"></p>
      <p id="end-best" class="end-best"></p>
      <button id="again" class="btn btn-big">Tornar a jugar</button>
    </div>
  </div>

  <script src="cards.js"></script>
  <script type="module" src="game3d.js"></script>
</body>
</html>
